openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: متجري — SaaS perfume & cosmetics storefront platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Merchant authentication
  - name: dashboard
    description: Merchant dashboard (protected)
  - name: storefront
    description: Public storefront for customers

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ───────────────────────────────────────────────
  /auth/register:
    post:
      operationId: registerMerchant
      tags: [auth]
      summary: Register a new merchant account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantRegister"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginMerchant
      tags: [auth]
      summary: Login merchant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantLogin"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutMerchant
      tags: [auth]
      summary: Logout merchant
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated merchant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Dashboard Stats ─────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get merchant dashboard stats — orders this month, revenue, top products
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Dashboard Settings ───────────────────────────────────
  /dashboard/settings:
    get:
      operationId: getDashboardSettings
      tags: [dashboard]
      summary: Get merchant store settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateDashboardSettings
      tags: [dashboard]
      summary: Update merchant store settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Products ─────────────────────────────────────────────
  /dashboard/products:
    get:
      operationId: listProducts
      tags: [dashboard]
      summary: List merchant products
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [dashboard]
      summary: Create a product (multipart with optional image uploads)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProductCreateBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/products/{id}:
    get:
      operationId: getProduct
      tags: [dashboard]
      summary: Get a single product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateProduct
      tags: [dashboard]
      summary: Update a product (multipart with optional image uploads)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProductUpdateBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      tags: [dashboard]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Orders ───────────────────────────────────────────────
  /dashboard/orders:
    get:
      operationId: listOrders
      tags: [dashboard]
      summary: List merchant orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"

  /dashboard/orders/{id}:
    get:
      operationId: getOrder
      tags: [dashboard]
      summary: Get a single order with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [dashboard]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Discount Codes ───────────────────────────────────────
  /dashboard/discounts:
    get:
      operationId: listDiscounts
      tags: [dashboard]
      summary: List merchant discount codes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscountCode"
    post:
      operationId: createDiscount
      tags: [dashboard]
      summary: Create a discount code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountCode"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/discounts/{id}:
    delete:
      operationId: deleteDiscount
      tags: [dashboard]
      summary: Delete a discount code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /dashboard/discounts/{id}/toggle:
    patch:
      operationId: toggleDiscount
      tags: [dashboard]
      summary: Toggle discount code active/inactive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountCode"

  # ─── Push Notifications ──────────────────────────────────
  /dashboard/push/vapid-public-key:
    get:
      operationId: getVapidPublicKey
      tags: [dashboard]
      summary: Get the public VAPID key for web-push subscriptions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidPublicKey"
        "503":
          description: Push notifications not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/push/subscribe:
    post:
      operationId: subscribeToPush
      tags: [dashboard]
      summary: Save a web-push subscription for the merchant (upsert by endpoint)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "201":
          description: Subscribed
        "400":
          description: Invalid subscription data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/push/unsubscribe:
    delete:
      operationId: unsubscribeFromPush
      tags: [dashboard]
      summary: Remove all push subscriptions for this merchant on an endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "204":
          description: Unsubscribed
        "400":
          description: Invalid subscription data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Dashboard Reviews ──────────────────────────────────
  /dashboard/reviews:
    get:
      operationId: listReviews
      tags: [dashboard]
      summary: List reviews for the current merchant's products
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, all]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardReviewsResponse"

  /dashboard/reviews/{id}:
    patch:
      operationId: decideReview
      tags: [dashboard]
      summary: Approve or unapprove a review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteReview
      tags: [dashboard]
      summary: Delete a review (reject/remove from queue)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Dashboard Stock Notifications ──────────────────
  /dashboard/stock-notifications:
    get:
      operationId: listStockNotifications
      tags: [dashboard]
      summary: List stock notifications for the current merchant's product variants
      parameters:
        - name: productId
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockNotificationListResponse"

  /dashboard/stock-notifications/{id}:
    patch:
      operationId: updateStockNotification
      tags: [dashboard]
      summary: Mark a stock notification as contacted
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockNotificationUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockNotification"
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Dashboard Bundles ─────────────────────────────
  /dashboard/bundles:
    get:
      operationId: listBundles
      tags: [dashboard]
      summary: List gift bundles for the current merchant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleListResponse"
    post:
      operationId: createBundle
      tags: [dashboard]
      summary: Create a gift bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BundleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
        "400":
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/bundles/{id}:
    put:
      operationId: updateBundle
      tags: [dashboard]
      summary: Update a gift bundle (replaces its items)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BundleInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
        "404":
          description: Bundle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBundle
      tags: [dashboard]
      summary: Delete a gift bundle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Bundle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/bundles/{id}/image:
    put:
      operationId: uploadBundleImage
      tags: [dashboard]
      summary: Upload (or replace) the bundle image — stored in the database
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "201":
          description: Image stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleImageResponse"
        "400":
          description: No image provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Bundle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBundleImage
      tags: [dashboard]
      summary: Remove the bundle image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Image removed
        "404":
          description: Bundle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bundles/{id}/image:
    get:
      operationId: getBundleImage
      tags: [storefront]
      summary: Serve the bundle image bytes (public)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Storefront (Public) ──────────────────────────────────
  /stores/{slug}:
    get:
      operationId: getStore
      tags: [storefront]
      summary: Get a public store
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePublic"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stores/{slug}/products:
    get:
      operationId: browseStoreProducts
      tags: [storefront]
      summary: Browse all products in a public store
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Partial match against the product name
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: Filter by product category
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "404":
          description: Store not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stores/{slug}/products/{productId}:
    get:
      operationId: getStoreProduct
      tags: [storefront]
      summary: Get a product on the public storefront
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stores/{slug}/products/{productId}/related:
    get:
      operationId: getRelatedProducts
      tags: [storefront]
      summary: Get related products in the same store and category as a product
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "404":
          description: Product or store not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stores/{slug}/products/{productId}/reviews:
    get:
      operationId: getProductReviews
      tags: [storefront]
      summary: Get approved reviews and average rating for a product
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductReviewsResponse"
        "404":
          description: Product or store not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createProductReview
      tags: [storefront]
      summary: Submit a review for a product (stored pending approval)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductReviewInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product or store not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stores/{slug}/products/{productId}/variants/{variantId}/stock-notifications:
    post:
      operationId: createStockNotification
      tags: [storefront]
      summary: Register a phone number to be notified when an out-of-stock variant becomes available
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: number
        - name: variantId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockNotificationCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockNotification"
        "400":
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product, store or variant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Variant is already in stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stores/{slug}/bundles:
    get:
      operationId: browseStoreBundles
      tags: [storefront]
      summary: List active gift bundles for a public store
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleListResponse"
        "404":
          description: Store not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stores/{slug}/validate-discount:
    post:
      operationId: validateDiscount
      tags: [storefront]
      summary: Validate a discount code for a store
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountValidation"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountValidationResult"
        "400":
          description: Invalid or inactive code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stores/{slug}/discounts/{code}/validate:
    get:
      operationId: validateDiscountCode
      tags: [storefront]
      summary: Validate a discount code for a store (no side effects)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountCodeValidationResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stores/{slug}/orders:
    post:
      operationId: placeOrder
      tags: [storefront]
      summary: Place a new order on a store
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderConfirmation"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Store not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stores/{slug}/orders/{orderId}:
    get:
      operationId: getStoreOrder
      tags: [storefront]
      summary: Track a store order by ID and phone
      description: Returns the order status and line items to the customer. Requires the phone number used when placing the order to prevent enumeration of sequential order IDs.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: orderId
          in: path
          required: true
          schema:
            type: number
        - name: phone
          in: query
          required: true
          description: Phone number used when placing the order (privacy check)
          schema:
            type: string
      responses:
        "200":
          description: Order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackOrderResponse"
        "400":
          description: Missing phone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found or phone mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ─── Auth ───────────────────────────────────────────────
    MerchantRegister:
      type: object
      required: [storeName, slug, email, password]
      properties:
        storeName:
          type: string
        slug:
          type: string
          description: Unique store URL slug
        email:
          type: string
        password:
          type: string

    MerchantLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [merchant, token, newOrdersCount]
      properties:
        merchant:
          $ref: "#/components/schemas/Merchant"
        token:
          type: string
        newOrdersCount:
          type: number
          description: Count of orders with status "new" at the moment of login — used to initialise the seen-orders baseline so the merchant doesn't see a badge for historical orders

    Merchant:
      type: object
      required: [id, slug, storeName, email, accentColor, createdAt]
      properties:
        id:
          type: number
        slug:
          type: string
        storeName:
          type: string
        email:
          type: string
        logoUrl:
          type: ["string", "null"]
        bannerUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        accentColor:
          type: string
        bankTransferInfo:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        instagramHandle:
          type: ["string", "null"]
        whatsappNumber:
          type: ["string", "null"]
        createdAt:
          type: string
        productCount:
          type: ["number", "null"]
        orderCount:
          type: ["number", "null"]

    MerchantUpdate:
      type: object
      properties:
        storeName:
          type: string
        logoUrl:
          type: ["string", "null"]
        bannerUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        accentColor:
          type: string
        bankTransferInfo:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        instagramHandle:
          type: ["string", "null"]
        whatsappNumber:
          type: ["string", "null"]

    # ─── Dashboard ──────────────────────────────────────────
    DashboardStats:
      type: object
      required: [ordersThisMonth, revenueThisMonth, totalOrders, totalRevenue, newOrdersCount, topProducts, ordersByStatus, recentOrders, lowStockCount, lowStockItems]
      properties:
        ordersThisMonth:
          type: number
        revenueThisMonth:
          type: number
        totalOrders:
          type: number
        totalRevenue:
          type: number
        newOrdersCount:
          type: number
          description: Count of orders with status "new" (unseen by merchant)
        topProducts:
          type: array
          items:
            $ref: "#/components/schemas/TopProduct"
        ordersByStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        lowStockCount:
          type: number
          description: Number of product variants with stock at or below the low-stock threshold (5)
        lowStockItems:
          type: array
          items:
            $ref: "#/components/schemas/LowStockItem"

    LowStockItem:
      type: object
      required: [variantId, productId, productName, variantLabel, stock]
      properties:
        variantId:
          type: number
        productId:
          type: number
        productName:
          type: string
        variantLabel:
          type: string
        stock:
          type: number

    TopProduct:
      type: object
      required: [productId, productName, totalSold, totalRevenue]
      properties:
        productId:
          type: number
        productName:
          type: string
        totalSold:
          type: number
        totalRevenue:
          type: number

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: number

    # ─── Products ───────────────────────────────────────────
    ProductVariant:
      type: object
      required: [id, variantLabel, price, stock]
      properties:
        id:
          type: number
        variantLabel:
          type: string
        price:
          type: number
        stock:
          type: number

    ProductVariantInput:
      type: object
      required: [variantLabel, price]
      properties:
        variantLabel:
          type: string
        price:
          type: number
        stock:
          type: number

    Product:
      type: object
      required: [id, merchantId, name, category, isActive, createdAt, variants]
      properties:
        id:
          type: number
        merchantId:
          type: number
        name:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        noteTop:
          type: ["string", "null"]
        noteHeart:
          type: ["string", "null"]
        noteBase:
          type: ["string", "null"]
        skinType:
          type: ["string", "null"]
        ingredients:
          type: ["string", "null"]
        batchExpiry:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"

    ProductInput:
      type: object
      required: [name, category, variants]
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        noteTop:
          type: ["string", "null"]
        noteHeart:
          type: ["string", "null"]
        noteBase:
          type: ["string", "null"]
        skinType:
          type: ["string", "null"]
        ingredients:
          type: ["string", "null"]
        batchExpiry:
          type: ["string", "null"]
        isActive:
          type: boolean
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariantInput"

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        noteTop:
          type: ["string", "null"]
        noteHeart:
          type: ["string", "null"]
        noteBase:
          type: ["string", "null"]
        skinType:
          type: ["string", "null"]
        ingredients:
          type: ["string", "null"]
        batchExpiry:
          type: ["string", "null"]
        isActive:
          type: boolean
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariantInput"

    ProductCreateBody:
      type: object
      required: [data]
      description: >-
        multipart/form-data body for POST /dashboard/products. The product
        payload object is sent in the `data` field (serialized as JSON on the
        wire); optional image files go in `images` (max 10).
      properties:
        data:
          $ref: "#/components/schemas/ProductInput"
        images:
          type: array
          maxItems: 10
          items:
            type: string
            format: binary
            description: Product image file (max 10)

    ProductUpdateBody:
      type: object
      required: [data]
      description: >-
        multipart/form-data body for PUT /dashboard/products/{id}. The updated
        product payload object is sent in `data` (serialized as JSON on the
        wire); `keepUrls` lists the existing /api/images/{id} URLs to keep; new
        image files go in `images`.
      properties:
        data:
          $ref: "#/components/schemas/ProductUpdate"
        keepUrls:
          type: string
          description: JSON array of existing image URLs to keep
        images:
          type: array
          maxItems: 10
          items:
            type: string
            format: binary
            description: Product image file (max 10)

    VapidPublicKey:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: string

    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
            auth:
              type: string

    # ─── Orders ─────────────────────────────────────────────
    OrderItem:
      type: object
      required: [id, productName, variantLabel, quantity, priceAtOrder]
      properties:
        id:
          type: number
        variantId:
          type: ["number", "null"]
        productName:
          type: string
        variantLabel:
          type: string
        quantity:
          type: number
        priceAtOrder:
          type: number

    Order:
      type: object
      required: [id, merchantId, customerName, customerPhone, customerAddress, paymentMethod, isGift, subtotal, total, status, createdAt]
      properties:
        id:
          type: number
        merchantId:
          type: number
        customerName:
          type: string
        customerPhone:
          type: string
        customerAddress:
          type: string
        paymentMethod:
          type: string
        isGift:
          type: boolean
        giftMessage:
          type: ["string", "null"]
        discountCode:
          type: ["string", "null"]
        subtotal:
          type: number
        total:
          type: number
        status:
          type: string
        createdAt:
          type: string

    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OrderItem"

    TrackOrderResponse:
      type: object
      required: [id, status, subtotal, total, createdAt, items]
      properties:
        id:
          type: number
        status:
          type: string
          description: One of new, processing, shipped, delivered, cancelled
        subtotal:
          type: number
        total:
          type: number
        discountCode:
          type: ["string", "null"]
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    OrderListResponse:
      type: object
      required: [orders, total, page, pageSize]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: number
        page:
          type: number
        pageSize:
          type: number

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string

    OrderItemInput:
      type: object
      required: [quantity]
      properties:
        variantId:
          type: number
        bundleId:
          type: number
        quantity:
          type: number

    OrderInput:
      type: object
      required: [customerName, customerPhone, customerAddress, paymentMethod, items]
      properties:
        customerName:
          type: string
        customerPhone:
          type: string
        customerAddress:
          type: string
        paymentMethod:
          type: string
        isGift:
          type: boolean
        giftMessage:
          type: ["string", "null"]
        discountCode:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"

    OrderConfirmation:
      type: object
      required: [orderId, total, storeName]
      properties:
        orderId:
          type: number
        total:
          type: number
        storeName:
          type: string
        storeSlug:
          type: string

    # ─── Discounts ───────────────────────────────────────────
    DiscountCode:
      type: object
      required: [id, merchantId, code, isActive, createdAt]
      properties:
        id:
          type: number
        merchantId:
          type: number
        code:
          type: string
        percentOff:
          type: ["number", "null"]
        amountOff:
          type: ["number", "null"]
        minOrderTotal:
          type: ["number", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    DiscountInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
        percentOff:
          type: number
        amountOff:
          type: number
        minOrderTotal:
          type: number
        isActive:
          type: boolean

    DiscountValidation:
      type: object
      required: [code]
      properties:
        code:
          type: string

    DiscountValidationResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        percentOff:
          type: ["number", "null"]
        amountOff:
          type: ["number", "null"]
        minOrderTotal:
          type: ["number", "null"]
        code:
          type: string

    DiscountCodeValidationResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        percentOff:
          type: ["number", "null"]
        amountOff:
          type: ["number", "null"]
        minOrderTotal:
          type: ["number", "null"]

    # ─── Storefront ──────────────────────────────────────────
    StorePublic:
      type: object
      required: [slug, storeName, accentColor, createdAt]
      properties:
        slug:
          type: string
        storeName:
          type: string
        logoUrl:
          type: ["string", "null"]
        bannerUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        accentColor:
          type: string
        phone:
          type: ["string", "null"]
        bankTransferInfo:
          type: ["string", "null"]
        instagramHandle:
          type: ["string", "null"]
        whatsappNumber:
          type: ["string", "null"]
        createdAt:
          type: string

    # ─── Reviews ────────────────────────────────────────────
    Review:
      type: object
      required: [id, productId, customerName, rating, isApproved, createdAt]
      properties:
        id:
          type: number
        productId:
          type: number
        customerName:
          type: string
        rating:
          type: number
          minimum: 1
          maximum: 5
        comment:
          type: ["string", "null"]
        isApproved:
          type: boolean
        createdAt:
          type: string

    ProductReviewInput:
      type: object
      required: [customerName, rating]
      properties:
        customerName:
          type: string
          maxLength: 100
        rating:
          type: number
          minimum: 1
          maximum: 5
        comment:
          type: ["string", "null"]

    ProductReviewsResponse:
      type: object
      required: [reviews, averageRating]
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        averageRating:
          type: number

    DashboardReview:
      type: object
      required: [id, productId, productName, customerName, rating, isApproved, createdAt]
      properties:
        id:
          type: number
        productId:
          type: number
        productName:
          type: string
        customerName:
          type: string
        rating:
          type: number
        comment:
          type: ["string", "null"]
        isApproved:
          type: boolean
        createdAt:
          type: string

    DashboardReviewsResponse:
      type: object
      required: [reviews]
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/DashboardReview"

    ReviewDecision:
      type: object
      required: [isApproved]
      properties:
        isApproved:
          type: boolean

    # ─── Stock Notifications ─────────────────────────────
    StockNotification:
      type: object
      required: [id, variantId, customerPhone, notified, createdAt]
      properties:
        id:
          type: number
        variantId:
          type: number
        customerPhone:
          type: string
        notified:
          type: boolean
        createdAt:
          type: string

    StockNotificationCreate:
      type: object
      required: [customerPhone]
      properties:
        customerPhone:
          type: string
          maxLength: 20

    StockNotificationUpdate:
      type: object
      required: [notified]
      properties:
        notified:
          type: boolean

    StockNotificationItem:
      type: object
      required: [id, variantId, productId, productName, variantLabel, customerPhone, notified, createdAt]
      properties:
        id:
          type: number
        variantId:
          type: number
        productId:
          type: number
        productName:
          type: string
        variantLabel:
          type: string
        customerPhone:
          type: string
        notified:
          type: boolean
        createdAt:
          type: string

    StockNotificationListResponse:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/StockNotificationItem"

    # ─── Gift Bundles ───────────────────────────────────
    BundleItem:
      type: object
      required: [id, variantId, variantLabel, productName, quantity]
      properties:
        id:
          type: number
        variantId:
          type: number
        variantLabel:
          type: string
        productName:
          type: string
        quantity:
          type: number

    BundleItemInput:
      type: object
      required: [variantId, quantity]
      properties:
        variantId:
          type: number
        quantity:
          type: number

    Bundle:
      type: object
      required: [id, merchantId, name, bundlePrice, isActive, createdAt, items]
      properties:
        id:
          type: number
        merchantId:
          type: number
        name:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
          description: Public URL served from the database image (or null)
        bundlePrice:
          type: number
        isActive:
          type: boolean
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/BundleItem"

    BundleImageResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string

    BundleInput:
      type: object
      required: [name, bundlePrice, items]
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        bundlePrice:
          type: number
        isActive:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/BundleItemInput"

    BundleListResponse:
      type: object
      required: [bundles]
      properties:
        bundles:
          type: array
          items:
            $ref: "#/components/schemas/Bundle"
