name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-api:
    name: Deploy API → staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & build api-server locally (fail fast)
        run: pnpm --filter @workspace/api-server build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (staging)
        working-directory: artifacts/api-server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --project 968922e3-db5f-43a5-949e-e26426a00558 --service "@workspace/api-server" --environment staging --detach --ci --yes --no-gitignore

  deploy-frontend:
    name: Deploy Frontend → staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend locally with staging API URL (fail fast)
        run: pnpm --filter @workspace/matjari build
        env:
          # يُستبدل عند توفر دومين ثابت لخدمة الـ API في بيئة staging
          VITE_API_URL: ${{ vars.STAGING_API_URL }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (staging)
        working-directory: artifacts/matjari
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --project 968922e3-db5f-43a5-949e-e26426a00558 --service "@workspace/matjari" --environment staging --detach --ci --yes --no-gitignore
