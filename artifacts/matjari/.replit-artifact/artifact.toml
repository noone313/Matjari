kind = "web"
previewPath = "/"
title = "متجري — لوحة التجار"
description = "A SaaS storefront platform for small perfume and cosmetics merchants in Iraq. Includes a merchant dashboard (products, orders, discounts, stats, store settings) and a public storefront with cart and checkout. Designed for Arabic RTL with a premium black-and-white aesthetic."
version = "1.0.0"
id = "artifacts/matjari"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24220

[services.development]
run = "pnpm --filter @workspace/matjari run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/matjari", "run", "build" ]
serve = "static"
publicDir = "artifacts/matjari/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24220"
BASE_PATH = "/"
